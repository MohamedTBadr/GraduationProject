name: Build and deploy ASP.Net Core app to Azure Web App - EpicHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./API/src/Web.API/Web.API.csproj

      - name: Build
        run: dotnet build ./API/src/Web.API/Web.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./API/src/Web.API/Web.API.csproj --configuration Release --no-restore -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 3bf0e4c7-3b85-469f-b536-f4d980252043
          tenant-id: 36cbfff1-02d2-4e78-a1d5-c57da5717a64
          subscription-id: 0080d04c-1f5b-4b85-97fe-909115140e80

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EpicHub'
          package: .
