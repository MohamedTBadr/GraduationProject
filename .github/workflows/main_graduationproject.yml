name: Build and deploy ASP.Net Core app to Azure Web App - EpicHub
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ── Web.API ──────────────────────────────────────────────
      - name: Restore Web.API
        run: dotnet restore ./API/src/Web.API/Web.API.csproj

      - name: Build Web.API
        run: dotnet build ./API/src/Web.API/Web.API.csproj --configuration Release --no-restore

      - name: Publish Web.API
        run: dotnet publish ./API/src/Web.API/Web.API.csproj --configuration Release --no-restore -o ./publish/webapi

      # ── Gateway ──────────────────────────────────────────────
      - name: Restore Gateway
        run: dotnet restore ./API/src/Gateway.API/Gateway.API.csproj

      - name: Build Gateway
        run: dotnet build ./API/src/Gateway.API/Gateway.API.csproj --configuration Release --no-restore

      - name: Publish Gateway
        run: dotnet publish ./API/src/Gateway.API/Gateway.API.csproj --configuration Release --no-restore -o ./publish/gateway

      # ── Upload .NET artifacts ─────────────────────────────────
      - name: Upload dotnet artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ./Front-End

      - name: Build Angular app
        run: npm run build -- --configuration production
        working-directory: ./Front-End

      # ── Inject web.config for Azure routing ──────────────────
      - name: Add web.config for Angular routing
        run: |
          cat > ./Front-End/dist/eventora/browser/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="Angular Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      # ── Upload frontend artifact ──────────────────────────────
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: ./Front-End/dist/eventora/browser

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dotnet artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 3bf0e4c7-3b85-469f-b536-f4d980252043
          tenant-id: 36cbfff1-02d2-4e78-a1d5-c57da5717a64
          subscription-id: 0080d04c-1f5b-4b85-97fe-909115140e80

      # Deploy Gateway first — it's the public entry point
      - name: Deploy Gateway to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EpicHub-Gateway'
          package: ./gateway

      # Deploy Web.API — only reachable through the Gateway
      - name: Deploy Web.API to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EpicHub'
          package: ./webapi

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: ./frontend

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 3bf0e4c7-3b85-469f-b536-f4d980252043
          tenant-id: 36cbfff1-02d2-4e78-a1d5-c57da5717a64
          subscription-id: 0080d04c-1f5b-4b85-97fe-909115140e80

      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EpicHubWeb'
          package: ./frontend
