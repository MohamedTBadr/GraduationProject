<div class="vd-svc-card cursor-pointer" [class.grid-mode]="viewMode === 'grid'" (click)="actionClick.emit('detail')">
  <!-- Image or Fallback Icon -->
  <img class="svc-media w-[70px] h-[70px] rounded-[12px] object-cover shrink-0 [box-shadow:0_2px_8px_rgba(0,0,0,0.05)]"
       *ngIf="coverImage; else fallbackIcon"
       [src]="coverImage"
       [alt]="service.name"
       loading="lazy"
       (error)="onImageError()">
  <ng-template #fallbackIcon>
    <div class="vd-svc-icon bg-[#f8fafc] rounded-[12px] flex items-center justify-center w-[70px] h-[70px] shrink-0 [box-shadow:0_2px_8px_rgba(0,0,0,0.05)]">
      <i class="bi bi-tools" style="font-size:1.6rem;color:var(--gray)"></i>
    </div>
  </ng-template>

  <!-- Content -->
  <div class="svc-content flex-1 py-[0] px-[16px]">
    <div class="vd-svc-name font-bold text-[#1e3a5f] mb-[4px] text-[1.05rem]">
      {{ service.name }}
    </div>
    <div class="vd-svc-price text-[#b34a6c] font-semibold mb-[6px] text-[0.95rem]">
      {{ service.price | currency:'EGP' }}
    </div>
    <div class="vd-svc-desc text-[#64748b] text-[0.85rem] mb-[8px]">
      {{ service.description }}
    </div>
    
    <div class="vd-svc-meta text-[0.8rem] text-[#64748b] flex gap-[12px] items-center">
      <span class="has-images" *ngIf="imageCount > 0">
        <i class="bi bi-images me-1"></i>{{ imageCount }} photo{{ imageCount === 1 ? '' : 's' }}
      </span>
      <span *ngIf="service.status === 'active'">0 bookings</span>
      <span *ngIf="service.status === 'paused'">Paused since today</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="vd-svc-actions flex gap-[8px] items-center">
    <span class="bg-[rgba(253,_230,_138,_0.4)] text-[#b45309] py-[4px] px-[12px] rounded-[20px] text-[0.75rem] font-semibold" *ngIf="service.status === 'paused'">Paused</span>
    <span class="bg-[#dcfce7] text-[#166534] py-[4px] px-[12px] rounded-[20px] text-[0.75rem] font-semibold" *ngIf="service.status !== 'paused'">Active</span>

    <button class="w-[34px] h-[34px] flex items-center justify-center rounded-full bg-[white] [border:1px_solid_#bbf7d0] text-[#16a34a] cursor-pointer [transition:all_0.2s] hover:bg-[#dcfce7]" *ngIf="service.status === 'paused'" title="Activate" (click)="$event.stopPropagation(); actionClick.emit('activate')"><i class="bi bi-play-fill" style="font-size:0.95rem"></i></button>
    <button class="w-[34px] h-[34px] flex items-center justify-center rounded-full bg-[white] [border:1px_solid_#e2e8f0] text-[#64748b] cursor-pointer [transition:all_0.2s] hover:bg-[#f1f5f9]" *ngIf="service.status !== 'paused'" title="Pause" (click)="$event.stopPropagation(); actionClick.emit('pause')"><i class="bi bi-pause-fill" style="font-size:0.95rem"></i></button>
    <button class="w-[34px] h-[34px] flex items-center justify-center rounded-full bg-[white] [border:1px_solid_#e2e8f0] text-[#334155] cursor-pointer [transition:all_0.2s] hover:bg-[#f1f5f9]" title="Edit" (click)="$event.stopPropagation(); actionClick.emit('edit')"><i class="bi bi-pencil" style="font-size:0.9rem"></i></button>
    <button class="w-[34px] h-[34px] flex items-center justify-center rounded-full bg-[white] [border:1px_solid_#fecaca] text-[#ef4444] cursor-pointer [transition:all_0.2s] hover:bg-[#fef2f2]" title="Delete" (click)="$event.stopPropagation(); actionClick.emit('delete')"><i class="bi bi-trash" style="font-size:0.9rem"></i></button>
  </div>
</div>
