<!-- NAV -->
<nav class="nav" [class.scrolled]="isScrolled" (click)="closeNotificationPanel($event)">
  <div class="nav-inner">
    <div class="nav-logo" routerLink="/">Epic<span>Hub</span></div>

    <ul class="nav-links">
      <li><a routerLink="/explore-services">Explore Services</a></li>
      <li><a routerLink="/explore">Explore Vendors</a></li>
      <li><a routerLink="/packages">Packages</a></li>
      <li><a routerLink="/corporate">Corporate</a></li>
      <li><a routerLink="/vendor-join">Become a Vendor</a></li>
      <li><a routerLink="/contact">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <!-- Chat Messages -->
      <button
        *ngIf="authService.isLoggedIn()"
        class="nav-icon-btn"
        (click)="goToMessages()"
        title="Messages"
      >
        💬
      </button>

      <!-- Notifications -->
      <div class="nav-notif-wrapper" *ngIf="authService.isLoggedIn()">
        <button 
          class="nav-icon-btn" 
          title="Notifications"
          (click)="toggleNotificationPanel($event)"
        >
          🔔
          <div class="notif-badge" [class.visible]="signalRService.unreadCount() > 0">
            {{ signalRService.unreadCount() > 9 ? '9+' : signalRService.unreadCount() }}
          </div>
        </button>

        <!-- Notification Dropdown Panel -->
        <div class="notif-panel" *ngIf="showNotifPanel" (click)="$event.stopPropagation()">
          <div class="notif-panel-header">
            <span class="notif-panel-title">Notifications</span>
            <button class="notif-clear-btn" *ngIf="signalRService.notifications().length > 0" (click)="clearNotifications()">Clear all</button>
          </div>
          <div class="notif-list" *ngIf="signalRService.notifications().length > 0">
            <div class="notif-item" *ngFor="let n of signalRService.notifications().slice(0, 8)">
              <div class="notif-dot"></div>
              <div class="notif-content">
                <strong class="notif-title">{{ n.title }}</strong>
                <p class="notif-message">{{ n.message }}</p>
                <span class="notif-time">{{ n.createdAt | date:'shortTime' }}</span>
              </div>
            </div>
          </div>
          <div class="notif-empty" *ngIf="signalRService.notifications().length === 0">
            <span>🔔</span>
            <p>You're all caught up!</p>
          </div>
        </div>
      </div>

      <!-- Favorites -->
      <button
        class="nav-fav-btn"
        (click)="goToFavorites()"
        title="My Favorites"
      >
        🤍
        <div class="notif-badge" [class.visible]="favoriteService.favoritesCount() > 0">
          {{ favoriteService.favoritesCount() }}
        </div>
      </button>

      <button (click)="theme.toggle()">
        {{ theme.isDark ? "☀️" : "🌙" }}
      </button>

      <!-- Not Logged In -->
      <ng-container *ngIf="!authService.isLoggedIn()">
        <button class="btn-nav-login" (click)="openLoginModal()">Login</button>
        <button class="btn-nav-cta" (click)="openSignupModal()">
          Get Started
        </button>
      </ng-container>

      <!-- Logged In -->
      <ng-container *ngIf="authService.isLoggedIn()">
        <!-- Admin -->
        <button
          *ngIf="authService.role() === 'Admin'"
          class="btn-nav-admin"
          routerLink="/admin"
          title="Admin Panel"
        >
          Admin
        </button>

        <!-- Vendor -->
        <button
          *ngIf="authService.role() === 'Vendor'"
          class="btn-nav-vendor"
          routerLink="/vendor-dashboard"
          title="Vendor Portal"
        >
          Dashboard
        </button>

        <!-- User -->
        <button
          *ngIf="authService.role() === 'User'"
          class="btn-nav-login"
          routerLink="/user/my-events"
          title="My Events"
        >
          My Portal
        </button>

        <button class="btn btn-navy btn-sm text-[#dc2626] bg-[transparent] ml-[12px] border-[#dc2626]" (click)="logout()">
          Logout
        </button>
      </ng-container>
    </div>
  </div>
</nav>
