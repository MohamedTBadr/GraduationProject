<!-- NAV -->
<nav class="nav" [class.scrolled]="isScrolled" (click)="closeNotificationPanel($event)">
  <div class="nav-inner">
    <div class="nav-logo" routerLink="/">Epic<span>Hub</span></div>

    <ul class="nav-links">
      <li><a routerLink="/explore" [queryParams]="{tab: 'services'}">Explore</a></li>
      <!-- <li><a routerLink="/explore">Explore Vendors</a></li> -->
      <li><a routerLink="/corporate">Corporate</a></li>
      <li><a routerLink="/vendor-join">Become a Vendor</a></li>
      <li><a routerLink="/contact">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <!-- Chat Messages -->
      <button
        *ngIf="authService.isLoggedIn()"
        class="nav-icon-btn"
        (click)="goToMessages()"
        title="Messages"
      >
        <i class="bi bi-chat"></i>
      </button>

      <!-- Notifications (personal inbox — not admin broadcast) -->
      <div class="nav-notif-wrapper" *ngIf="authService.isLoggedIn() && authService.role() !== 'Admin'">
        <button
          class="nav-icon-btn"
          title="Notifications"
          (click)="toggleNotificationPanel($event)"
        >
          <i class="bi bi-bell"></i>
          <div class="notif-badge" [class.visible]="signalRService.unreadCount() > 0">
            {{ signalRService.unreadCount() > 9 ? '9+' : signalRService.unreadCount() }}
          </div>
        </button>

        <!-- Notification Dropdown Panel -->
        <div class="notif-panel" *ngIf="showNotifPanel" (click)="$event.stopPropagation()">
          <div class="notif-panel-header">
            <span class="notif-panel-title">Notifications</span>
            <button class="notif-clear-btn" *ngIf="signalRService.notifications().length > 0" (click)="goToNotificationsPage()">View all</button>
          </div>
          <div class="notif-list" *ngIf="signalRService.notifications().length > 0">
            <div
              class="notif-item"
              *ngFor="let n of signalRService.notifications().slice(0, 8)"
              [class.read]="n.isRead"
              (click)="goToNotificationsPage()">
              <div class="notif-dot" *ngIf="!n.isRead"></div>
              <div class="notif-content">
                <strong class="notif-title">{{ n.title }}</strong>
                <p class="notif-message">{{ n.message }}</p>
                <span class="notif-time">{{ n.createdAt | date:'shortTime' }}</span>
              </div>
            </div>
          </div>
          <div class="notif-empty" *ngIf="signalRService.notifications().length === 0">
            <i class="bi bi-bell-slash"></i>
            <p>You're all caught up!</p>
          </div>
        </div>
      </div>

      <!-- Favorites -->
      <button
        class="nav-fav-btn"
        (click)="goToFavorites()"
        title="My Favorites"
      >
        <i class="bi bi-heart-fill"></i>
        <div class="notif-badge" [class.visible]="favoriteService.favoritesCount() > 0">
          {{ favoriteService.favoritesCount() }}
        </div>
      </button>

      <!-- Theme toggle -->
      <button class="nav-icon-btn" (click)="theme.toggleTheme()" title="Toggle theme">
        <i [class]="theme.isDark() ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
      </button>

      <!-- Not Logged In -->
      <ng-container *ngIf="!authService.isLoggedIn()">
        <button class="btn-nav-login" (click)="openLoginModal()">Login</button>
        <button class="btn-nav-cta" (click)="openSignupModal()">
          Get Started
        </button>
      </ng-container>

      <!-- Logged In -->
      <ng-container *ngIf="authService.isLoggedIn()">
        <!-- Admin -->
        <button
          *ngIf="authService.role() === 'Admin'"
          class="btn-nav-admin"
          routerLink="/admin"
          title="Admin Panel"
        >
          Admin
        </button>

        <!-- Vendor -->
        <button
          *ngIf="authService.role() === 'Vendor'"
          class="btn-nav-vendor"
          routerLink="/vendor-dashboard"
          title="Vendor Portal"
        >
          Dashboard
        </button>

        <!-- User -->
        <button
          *ngIf="authService.role() === 'User'"
          class="btn-nav-login"
          routerLink="/user/dashboard"
          title="My Events"
        >
          My Portal
        </button>

        <button class="btn-nav-logout" (click)="logout()">Logout</button>
      </ng-container>
    </div>
  </div>
</nav>
