<div class="vendor-card" [routerLink]="['/vendor', vendor.id]">
    <div class="vc-photo">
        <div class="vc-photo-inner" [style.background]="getGradient(vendor.id)">{{vendor.name.charAt(0)}}</div>
        <div class="vc-top-row">
            <span class="vc-cat-badge">{{vendor.categoryName || 'Vendor'}}</span>
            <div class="flex gap-[7px]">
                <button class="compare-btn" [class.active]="compareService.isInCompare(vendor.id)"
                    (click)="onToggleCompare($event)">️</button>
                <button class="vc-fav-btn" [class.active]="isFavorite()"
                    (click)="onToggleFavorite($event)"></button>
            </div>
        </div>
    </div>
    <div class="vc-body">
        <div class="vc-name">{{vendor.name}}</div>
        <div class="vc-loc" *ngIf="vendor.location">📍 {{vendor.location}}</div>
        <div class="vc-rating-row">
            <span class="stars text-[var(--gold)] text-[.8rem]"></span>
            <span class="font-bold text-[.85rem] text-[var(--navy)] ml-[4px]">{{vendor.rating || 'New'}}</span>
            <span class="vc-review-count"></span>
        </div>
        <div class="vc-footer">
            <div class="vc-price"><strong>Ask for price</strong></div>
            <button class="vc-view-btn">View Profile</button>
        </div>
    </div>
</div>
