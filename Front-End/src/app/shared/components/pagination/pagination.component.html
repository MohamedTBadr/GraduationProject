<div class="app-pagination" [class.is-explore]="variant === 'explore'" [class.is-admin]="variant === 'admin'" *ngIf="visible">
  <div class="pg-summary" *ngIf="showSummary && totalCount > 0">
    Page {{ currentPage }} of {{ totalPages }}
    <span class="pg-total" *ngIf="totalCount"> · {{ totalCount }} total</span>
  </div>

  <div class="pg-controls" *ngIf="totalPages > 1">
    <button type="button" class="pg-btn pg-nav" [disabled]="currentPage === 1" (click)="goTo(currentPage - 1)" aria-label="Previous page">
      <i class="bi bi-chevron-left"></i>
    </button>

    <ng-container *ngFor="let p of pageNumbers">
      <span class="pg-ellipsis" *ngIf="p === -1">…</span>
      <button type="button" class="pg-btn" *ngIf="p !== -1" [class.active]="p === currentPage" (click)="goTo(p)" [attr.aria-current]="p === currentPage ? 'page' : null">
        {{ p }}
      </button>
    </ng-container>

    <button type="button" class="pg-btn pg-nav" [disabled]="currentPage === totalPages" (click)="goTo(currentPage + 1)" aria-label="Next page">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
