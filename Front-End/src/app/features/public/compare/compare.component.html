<div class="page active" id="page-compare">
    <div class="container py-[60px] px-[0] min-h-[70vh]">
        <div class="flex justify-between items-end mb-[40px]">
            <div>
                <h2 class="section-title">Compare Vendors</h2>
                <p class="section-sub">Side-by-side comparison to help you make the best choice.</p>
            </div>
            <button class="btn btn-outline" (click)="compareService.clearCompare()"
                *ngIf="compareService.compareCount() > 0">Clear All</button>
        </div>

        <div class="bg-[var(--cream)] p-[40px] rounded-[var(--r2)] text-center" *ngIf="compareService.compareCount() === 0">
            <div class="text-[3rem] mb-[16px]">️</div>
            <h3>No vendors selected for comparison</h3>
            <p class="text-[var(--gray)] mt-[12px]">Add at least 2 vendors from the Explore page to compare them
                side-by-side.</p>
            <button class="btn btn-gold mt-[24px]" routerLink="/explore">Explore Vendors</button>
        </div>

        <!-- Compare View -->
        <div *ngIf="compareService.compareCount() > 0" class="overflow-x-auto pb-[20px]">
            <div class="compare-grid">
                <!-- Feature List Column -->
                <div class="compare-col compare-features">
                    <div class="comp-cell comp-header"></div>
                    <div class="comp-cell" *ngFor="let f of getFeatures()">{{f.label}}</div>
                    <div class="comp-cell">Actions</div>
                </div>

                <!-- Vendor Columns -->
                <div class="compare-col" *ngFor="let v of compareService.compareListItems()">
                    <div class="comp-cell comp-header relative">
                        <button class="absolute bg-[none] [border:none] cursor-pointer text-[var(--gray)] [transition:color_.2s] top-[10px] right-[10px]" (click)="compareService.toggleCompare(v)" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--gray)'" title="Remove"></button>
                        <!-- class="text-[2.5rem] mb-[10px] mt-[20px]" <div>{{v.emoji}}</div> -->
                        <strong class="block text-[var(--navy)] text-[1.1rem] mb-[4px] overflow-hidden whitespace-nowrap text-ellipsis">{{v.name}}</strong>
                        <div class="text-[var(--gray)] text-[.75rem] mb-[12px]">{{v.vendorTypeName || 'Vendor'}}</div>
                    </div>

                    <!-- <div class="comp-cell" *ngFor="let f of getFeatures()">
                        <ng-container [ngSwitch]="f.key">
                            <strong class="text-[var(--gold)]" *ngSwitchCase="'startPrice'">{{v.startPrice | number}}
                                EGP</strong>
                            <div *ngSwitchCase="'rating'"><span class="stars text-[.9rem] mr-[4px]"></span> {{v.rating}}</div>
                            <span *ngSwitchDefault>{{ $any(v)[f.key] || '-' }}</span>
                        </ng-container>
                    </div> -->

                    <div class="comp-cell">
                        <button class="btn btn-navy btn-sm w-[100%] justify-center" [routerLink]="'/vendor/' + v.id">View Profile</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
