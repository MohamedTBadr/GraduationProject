<div class="page active" id="page-favorites">
    <div class="container py-[60px] px-[0] min-h-[70vh]">
        <div class="flex justify-between items-end mb-[40px]">
            <div>
                <h2 class="section-title">My Favorites</h2>
                <p class="section-sub">Vendors and packages you've saved for later.</p>
            </div>
            <button class="btn btn-outline" *ngIf="favorites.length > 0" (click)="clearFavorites()">Clear
                All</button>
        </div>

        <div class="text-center p-[40px] text-[var(--gray)]" *ngIf="loading">
            Loading favorites...
        </div>

        <div class="text-center py-[80px] px-[20px] bg-[var(--cream)] rounded-[12px]" *ngIf="!loading && favorites.length === 0">
            <div class="text-[3rem] mb-[16px]"></div>
            <h3 class="text-[1.4rem] text-[var(--navy)] mb-[8px] font-[var(--ff-d)]">No favourites yet
            </h3>
            <p class="text-[var(--gray)] mb-[24px]">Start exploring vendors and tap the heart icon to save them
                here.</p>
            <button class="btn btn-gold" routerLink="/explore">Explore Vendors</button>
        </div>

        <div class="explore-grid" *ngIf="!loading && favorites.length > 0">
            <div class="vendor-card" routerLink="/vendor/{{v.id}}" *ngFor="let v of paginatedFavorites">
                <div class="vc-photo">
                    <div class="vc-photo-inner bg-[linear-gradient(135deg,_hsl(230,_40%,_25%)_0%,_hsl(250,_45%,_30%)_100%)]">{{v.name.charAt(0)}}</div>
                    <div class="vc-top-row">
                        <div class="vc-cat-badge">{{v.vendorTypeName || 'Vendor'}}</div>
                        <button class="vc-fav-btn text-[var(--gold)]" (click)="removeFromFavorites(v.id, $event)"><i class="bi bi-heart-fill" style="color:#e11d48"></i>️</button>
                    </div>
                </div>
                <div class="vc-body">
                    <div class="vc-name">{{v.name}}</div>
                    <div class="vc-loc" *ngIf="v.location"><i class="bi bi-geo-alt-fill"></i> {{v.location}}</div>
                    <div class="vc-rating-row">
                        <span class="stars"></span>
                        <span class="vc-review-count">{{v.rating || 'New'}}</span>
                    </div>
                    <div class="vc-footer">
                        <div class="vc-price"><strong>Ask for price</strong></div>
                        <button class="vc-view-btn">View Profile</button>
                    </div>
                </div>
            </div>
        </div>

        <app-pagination
            *ngIf="!loading && favorites.length > pageSize"
            [currentPage]="pageNumber"
            [totalPages]="totalPages"
            [totalCount]="favorites.length"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)">
        </app-pagination>
    </div>
</div>
