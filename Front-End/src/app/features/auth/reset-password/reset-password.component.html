<div class="auth-page-wrapper">
  <div class="auth-box">
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle">Create a new password for {{email}}</p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-[24px]">
        <label>New Password</label>
        <input type="password" placeholder="Min. 6 characters" formControlName="newPassword"
          [class.is-invalid]="passwordControl?.invalid && passwordControl?.touched" />
        <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error-message">
          <small *ngIf="passwordControl?.hasError('required')">Password is required.</small>
          <small *ngIf="passwordControl?.hasError('pattern')">Password must have at least one lowercase ('a'-'z').</small>
          <br>
          <small *ngIf="passwordControl?.hasError('minlength')">Password must be at least 6 characters.</small>
          
        </div>
      </div>

      <button type="submit" class="auth-submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <div *ngIf="isLoading" class="spinner"></div>
      </button>
    </form>
  </div>
</div>
