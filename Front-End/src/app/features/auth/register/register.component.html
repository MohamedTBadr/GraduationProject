<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="modal-title">Create Account</div>
    <div class="modal-sub">Join the Eventora community.</div>
    
    <div class="modal-form">
        <div class="form-row">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" placeholder="Sara" formControlName="firstName" />
            </div>
            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" placeholder="Mohamed" formControlName="lastName" />
            </div>
        </div>

        <!-- Email Block -->
        <div class="form-group">
            <label>Email *</label>
            <input type="email" placeholder="your@email.com" formControlName="email"
                [class.is-invalid]="emailControl?.invalid && emailControl?.touched" />
            <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-message">
                <small *ngIf="emailControl?.hasError('required')">Email is required.</small>
                <small *ngIf="emailControl?.hasError('email')">Please enter a valid email.</small>
            </div>
        </div>

        <!-- Phone Block -->
        <div class="form-group">
            <label>Phone *</label>
            <input type="tel" placeholder="+20 100 000 0000" formControlName="phone" 
                [class.is-invalid]="phoneControl?.invalid && phoneControl?.touched" />
        </div>

        <!-- Password Block -->
        <div class="form-group">
            <label>Password *</label>
            <input type="password" placeholder="Min. 8 characters"
                formControlName="password"
                [class.is-invalid]="passwordControl?.invalid && passwordControl?.touched" />
            <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error-message">
                <small *ngIf="passwordControl?.hasError('required')">Password is required.</small>
                <small *ngIf="passwordControl?.hasError('minlength')">Password must be at least 8 characters.</small>
            </div>
        </div>

        <!-- Role Selection -->
        <div class="form-group">
            <label>Register As</label>
            <select formControlName="role">
                <option value="user">User</option>
                <option value="admin">Administrator</option>
                <option value="vendor">Vendor</option>
            </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="modal-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">Create Account →</span>
            <div *ngIf="isLoading" class="spinner"></div>
        </button>
        
        <div class="switch-mode">
            Already have an account? <a (click)="switchToLogin()">Login instead</a>
        </div>
    </div>
</form>
