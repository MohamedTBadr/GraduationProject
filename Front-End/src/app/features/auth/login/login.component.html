<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="modal-title">Welcome to Eventora</div>
    <div class="modal-sub">Sign in to your account.</div>
    
    <div class="modal-form">
        <!-- Email Block -->
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="your@email.com" formControlName="email"
                [class.is-invalid]="emailControl?.invalid && emailControl?.touched" />
            <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-message">
                <small *ngIf="emailControl?.hasError('required')">Email is required.</small>
                <small *ngIf="emailControl?.hasError('email')">Please enter a valid email.</small>
            </div>
        </div>

        <!-- Password Block -->
        <div class="form-group" style="margin-bottom: 5px;">
            <label>Password</label>
            <input type="password" placeholder="••••••••" formControlName="password"
                [class.is-invalid]="passwordControl?.invalid && passwordControl?.touched" />
            <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error-message">
                <small *ngIf="passwordControl?.hasError('required')">Password is required.</small>
                <small *ngIf="passwordControl?.hasError('minlength')">Password must be at least 6 characters.</small>
            </div>
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
            <a (click)="goToForgotPassword()" style="font-size: 0.85rem; color: var(--gold); cursor: pointer; text-decoration: underline;">Forgot Password?</a>
        </div>

        <!-- Role Selection
        <div class="form-group">
            <label>Login As</label>
            <select formControlName="role">
                <option value="user">User</option>
                <option value="admin">Administrator</option>
                <option value="vendor">Vendor</option>
            </select>
        </div> -->

        
        <button type="submit" class="modal-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">Login →</span>
            <div *ngIf="isLoading" class="spinner"></div>
        </button>

        <div class="switch-mode">
            Don't have an account? <a (click)="switchToRegister()">Sign up instead</a>
        </div>
    </div>
</form>
