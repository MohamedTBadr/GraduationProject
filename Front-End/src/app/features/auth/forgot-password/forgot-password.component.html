<div class="auth-page-wrapper">
  <div class="auth-box">
    <div *ngIf="!isSubmitted">
      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <div class="form-group" style="margin-bottom: 20px;">
          <label>Email Address</label>
          <input type="email" placeholder="your@email.com" formControlName="email"
              [class.is-invalid]="emailControl?.invalid && emailControl?.touched" />
          <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-message">
              <small *ngIf="emailControl?.hasError('required')">Email is required.</small>
              <small *ngIf="emailControl?.hasError('email')">Please enter a valid email.</small>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Send Reset Link</span>
          <div *ngIf="isLoading" class="spinner"></div>
        </button>
      </form>
    </div>

    <div *ngIf="isSubmitted" style="text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
      <h3 style="font-family: var(--ff-d); font-size: 1.5rem; color: var(--navy); margin-bottom: 10px;">Check your email</h3>
      <p style="color: var(--gray); font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;">
        If an account exists with that email, we've sent instructions on how to reset your password.
      </p>
      <button class="auth-submit-btn" routerLink="/" style="background: transparent; border: 1.5px solid var(--gold); color: var(--gold);">
        Return to Home
      </button>
    </div>
  </div>
</div>
