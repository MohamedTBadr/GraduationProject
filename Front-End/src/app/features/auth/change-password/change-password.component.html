<div class="auth-page-wrapper">
  <div class="auth-box">
    <div class="coming-soon-icon" aria-hidden="true">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h2 class="auth-title">Change Password</h2>
    <p class="auth-subtitle">
      In-app password change is coming soon. For now, use the email reset flow if you need to update your password.
    </p>

    <div class="coming-soon-note">
      <i class="bi bi-info-circle"></i>
      <span>This feature is pending backend support. You won’t be able to submit a new password from this page yet.</span>
    </div>

    <div class="flex flex-col gap-[12px] mt-[24px]">
      <a routerLink="/forgot-password" class="auth-submit-btn text-center no-underline">
        Reset via Email
      </a>
      <button type="button" class="auth-btn-ghost w-full" (click)="goBack()">
        Back to Dashboard
      </button>
    </div>
  </div>
</div>
