<div class="vd-section active" style="display:block" *ngIf="vendor">
  <div class="vd-page-header">
    <div>
      <div class="vd-page-title">My Profile</div>
      <div class="vd-page-sub">What clients see when they visit your vendor page.</div>
    </div>
    <button class="vd-btn vd-btn-ghost" routerLink="/vendor/1">View Public Profile →</button>
  </div>
  <div class="vd-cover"><div class="vd-cover-avatar"></div><div style="position:absolute;top:11px;right:11px"><button class="vd-btn vd-btn-ghost vd-btn-sm" style="background:rgba(255,255,255,.1);color:white;border-color:rgba(255,255,255,.2)">Change Cover</button></div></div>
  <div class="vd-tab-bar">
    <button class="vd-tab active">Business Info</button>
    <button class="vd-tab">Photos</button>
    <button class="vd-tab">Availability</button>
    <button class="vd-tab">Documents</button>
  </div>
  <div class="vd-tab-pane active" id="prf-info">
    <div class="vd-card">
      <div class="vd-form-row">
        <div class="vd-form-group">
          <label>Business Name</label>
          <input [(ngModel)]="vendor.name" />
        </div>
        <div class="vd-form-group">
          <label>Tagline/Category</label>
          <input [(ngModel)]="vendor.category" />
        </div>
      </div>
      <div class="vd-form-group">
        <label>Description</label>
        <textarea [(ngModel)]="vendor.about" rows="4"></textarea>
      </div>
      <div class="vd-form-row">
        <div class="vd-form-group">
          <label>Starting Price (EGP)</label>
          <input type="number" [(ngModel)]="vendor.startPrice" />
        </div>
        <div class="vd-form-group">
          <label>Main Location</label>
          <input type="text" [(ngModel)]="vendor.location" />
        </div>
      </div>
      <div class="vd-form-section"><div class="vd-form-section-lbl">Contact Details</div>
        <div class="vd-form-row"><div class="vd-form-group"><label>Phone / WhatsApp</label><input type="tel" value="+20 100 123 4567"/></div><div class="vd-form-group"><label>Email</label><input type="email" value="info@whiterosedecor.eg"/></div></div>
        <div class="vd-form-row"><div class="vd-form-group"><label>Instagram</label><input value="@whiterosedecor"/></div><div class="vd-form-group"><label>Website</label><input value="www.whiterosedecor.eg"/></div></div>
      </div>
      <div class="vd-submit-bar">
        <button class="vd-btn vd-btn-ghost" (click)="ngOnInit()">Discard</button>
        <button class="vd-btn vd-btn-gold" (click)="saveChanges()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
