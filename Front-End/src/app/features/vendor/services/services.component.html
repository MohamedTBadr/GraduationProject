<div class="vd-section active" style="display:block">
  <div class="vd-page-header">
    <div><div class="vd-page-title">My Services</div><div class="vd-page-sub">Manage the services you offer clients. Changes go live immediately.</div></div>
    <button class="vd-btn vd-btn-gold" routerLink="/vendor-dashboard">+ Add Service</button>
  </div>
  <div class="vd-tab-bar">
    <button class="vd-tab active">Active ({{ services.length }})</button>
    <button class="vd-tab">Paused (0)</button>
  </div>
  <div class="vd-tab-pane active" id="svcs-active">
    <div style="display:grid;gap:11px">
      <app-service-card 
        *ngFor="let service of services" 
        [service]="service" 
        (actionClick)="handleAction($event, service)">
      </app-service-card>
    </div>
  </div>
</div>
