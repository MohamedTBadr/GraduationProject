<div class="vd-section active block">
  <div class="vd-page-header">
    <div><div class="vd-page-title">Notifications</div><div class="vd-page-sub">Stay up to date on bookings, messages, reviews, and payouts.</div></div>
    <div class="flex gap-[7px]"><button class="vd-btn vd-btn-ghost vd-btn-sm" (click)="markAllAsRead()">Mark All Read</button><button class="vd-btn vd-btn-ghost vd-btn-sm"> Preferences</button></div>
  </div>
  <div class="vd-tab-bar">
    <button *ngFor="let tab of tabs" 
            class="vd-tab" 
            [class.active]="activeTab === tab"
            (click)="setTab(tab)">
      {{tab}} <span *ngIf="tab === 'All' && getUnreadCount() > 0">({{getUnreadCount()}})</span>
    </button>
  </div>
  <div class="vd-tab-pane active" id="nf-all">
    <div class="vd-card">
      <div id="vd-notifs-all" *ngIf="filteredNotifications.length > 0; else noNotifs">
        <div class="flex gap-[12px] py-[12px] px-[16px] [border-bottom:1px_solid_rgba(255,255,255,.05)] cursor-pointer rounded-[8px]" *ngFor="let notif of filteredNotifications" (click)="markAsRead(notif)" [ngClass]="!notif.isRead ? 'bg-[var(--cream)]' : 'bg-transparent'">
            <div class="text-[1.4rem]">
              <span *ngIf="notif.type === 'booking'">📅</span>
              <span *ngIf="notif.type === 'message'">💬</span>
              <span *ngIf="notif.type === 'review'">⭐</span>
              <span *ngIf="notif.type === 'finance'">💰</span>
              <span *ngIf="!['booking', 'message', 'review', 'finance'].includes(notif.type || '')">🔔</span>
            </div>
            <div class="flex-1">
                <div class="font-semibold text-[.9rem] mb-[4px]" [ngClass]="!notif.isRead ? 'text-[var(--navy)]' : 'text-inherit'">{{notif.title}}</div>
                <div class="text-[.8rem] text-[var(--gray)]">{{notif.message}}</div>
                <div class="text-[.7rem] text-[rgba(255,255,255,.3)] mt-[6px]">{{notif.createdAt | date:'medium'}}</div>
            </div>
            <div class="w-[8px] h-[8px] rounded-[50%] bg-[var(--gold)] mt-[6px]" *ngIf="!notif.isRead"></div>
        </div>
      </div>
      <ng-template #noNotifs>
        <div class="p-[40px] text-center text-[var(--gray)]">
          No notifications found.
        </div>
      </ng-template>
    </div>
  </div>
</div>
