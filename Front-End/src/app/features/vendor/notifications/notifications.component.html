<div class="vd-section active block">
  <div class="vd-page-header">
    <div>
      <div class="vd-page-title">Notifications</div>
      <div class="vd-page-sub">Stay up to date on bookings, events, payments, and account activity.</div>
    </div>
    <div class="flex gap-[7px]">
      <button class="vd-btn vd-btn-ghost vd-btn-sm" (click)="markAllAsRead()">Mark All Read</button>
    </div>
  </div>

  <!-- Tabs with per-tab unread counts -->
  <div class="vd-tab-bar">
    <button
      *ngFor="let tab of tabs"
      class="vd-tab"
      [class.active]="activeTab === tab"
      (click)="setTab(tab)">
      {{ tab }}
      <span class="tab-count" *ngIf="tabUnreadCount(tab) > 0">{{ tabUnreadCount(tab) }}</span>
    </button>
  </div>

  <div class="vd-tab-pane active">
    <div class="vd-card">
      <div *ngIf="filteredNotifications.length > 0; else noNotifs">
        <div
          class="notif-row"
          *ngFor="let notif of paginatedNotifications"
          [class.unread]="!notif.isRead"
          (click)="markAsRead(notif)">

          <!-- Icon -->
          <div class="notif-icon" [style]="getTypeColor(notif.type)">
            <i class="bi" [ngClass]="getTypeIcon(notif.type)"></i>
          </div>

          <!-- Body -->
          <div class="notif-body">
            <div class="notif-title-row">
              <span class="notif-title">{{ notif.title }}</span>
              <span class="live-badge" *ngIf="notif.isLive && !notif.isRead">● Live</span>
            </div>
            <div class="notif-message">{{ notif.message }}</div>
            <div class="notif-time">{{ notif.createdAt | date:'medium' }}</div>
          </div>

          <!-- Unread dot -->
          <div class="unread-dot" *ngIf="!notif.isRead"></div>
        </div>
      </div>

      <ng-template #noNotifs>
        <div class="p-[40px] text-center text-[var(--gray)]">
          No {{ activeTab === 'All' ? '' : activeTab.toLowerCase() + ' ' }}notifications found.
        </div>
      </ng-template>

      <app-pagination
        *ngIf="filteredNotifications.length > pageSize"
        [currentPage]="pageNumber"
        [totalPages]="totalPages"
        [totalCount]="filteredNotifications.length"
        [pageSize]="pageSize"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
