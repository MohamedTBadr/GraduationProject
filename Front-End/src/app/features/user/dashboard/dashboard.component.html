<div class="stats-row">
    <div class="stat-card" *ngFor="let s of stats">
        <div class="stat-icon">{{s.icon}}</div>
        <div class="stat-val">
            {{s.value}}
        </div>
        <div class="stat-lbl">{{s.label}}</div>
    </div>
</div>

<!-- Events List -->
<h3 class="dashboard-section-title">Active Planning</h3>

<div class="events-list">
    <div class="dash-card event-card" *ngFor="let ev of events" (click)="goToEvent(ev.id)">
        
        <div class="dash-card-title">
            {{ev.name}}
            <span class="days-left">{{ev.daysLeft}} days left</span>
        </div>
        
        <div class="event-meta">
            <span>📅 {{ev.date | date:'longDate'}}</span>
            <span>✨ {{ev.type}}</span>
            <span> {{ev.guests}} Guests</span>
        </div>

        <div class="event-progress-container">
            <!-- Vendors -->
            <div>
                <div class="budget-row">
                    <span>Vendors</span>
                    <strong>{{ev.vendorProgress}}</strong>
                </div>
                <div class="budget-bar">
                    <div class="budget-fill" [style.width]="(ev.vendorsConfirmed / ev.totalVendors * 100) + '%'"></div>
                </div>
            </div>

            <!-- Tasks -->
            <div>
                <div class="budget-row">
                    <span>Tasks</span>
                    <strong>{{ev.tasksProgress}}</strong>
                </div>
                <div class="budget-bar">
                    <div class="budget-fill fill-green" [style.width]="(ev.tasksDone / ev.totalTasks * 100) + '%'"></div>
                </div>
            </div>

            <!-- Budget -->
            <div>
                <div class="budget-row">
                    <span>Budget Used</span>
                    <strong>{{ev.budgetProgress}}</strong>
                </div>
                <div class="budget-bar">
                    <div class="budget-fill fill-amber" [style.width]="(ev.budgetUsed / ev.totalBudget * 100) + '%'"></div>
                </div>
            </div>
        </div>
    </div>
</div>
