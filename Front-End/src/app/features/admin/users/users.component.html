<div class="ad-section active block">
  <div class="ad-page-hd">
    <div>
      <div class="ad-page-title">User Management</div>
      <div class="ad-page-sub">All registered event planners and clients on the platform.</div>
    </div>
  </div>
  <div class="ad-kpi-grid [grid-template-columns:repeat(3,1fr)]">
    <div class="ad-kpi ak-blue"><div class="ad-kpi-val">{{ totalCount }}</div><div class="ad-kpi-lbl">Total Users</div></div>
  </div>
  <div class="ad-search-row">
    <div class="ad-search-wrap">
      <i class="bi bi-search ad-search-icon"></i>
      <input type="text" placeholder="Search users (Name or Email)…" [(ngModel)]="searchQuery" (input)="onSearchChange()"/>
    </div>
  </div>
  
  <div class="p-[2rem] text-center text-[var(--gold)]" *ngIf="loading">Loading users...</div>

  <div *ngIf="!loading" class="ad-tbl-wrap">
    <table class="ad-tbl">
      <thead><tr><th>User</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td><div><div>{{ u.name }}</div><div class="text-[.7rem] text-[rgba(255,255,255,.35)]">{{ u.email }}</div></div></td>
          <td><span class="ad-pill ap-green">{{ u.role || 'User' }}</span></td>
          <td>{{ (u.createdAt | date:'mediumDate') || 'N/A' }}</td>
          <td><div class="flex gap-[5px]">
             <button *ngIf="u.status !== 'suspended'" (click)="suspendUser(u)" class="ad-btn ad-btn-gold ad-btn-sm">Suspend</button>
             <button *ngIf="u.status === 'suspended'" (click)="unsuspendUser(u)" class="ad-btn ad-btn-green ad-btn-sm">Unsuspend</button>
             <button (click)="deleteUser(u)" class="ad-btn ad-btn-red ad-btn-sm">Delete</button>
          </div></td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td class="text-center p-[2rem] text-[#888]" colspan="4">No users found.</td>
        </tr>
      </tbody>
    </table>
    
    <app-pagination
      *ngIf="totalCount > 0"
      variant="admin"
      [currentPage]="pageNumber"
      [totalPages]="totalPages"
      [totalCount]="totalCount"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</div>
