<div class="ad-topbar">

  <div class="ad-topbar-search"><input type="text" placeholder="Search vendors, users, bookings…"/></div>
  <div class="ad-topbar-actions">
    <div class="ad-icon-btn theme-toggle" title="Toggle Theme"   (click)="theme.toggleTheme()">{{ theme.isDark() ? '☀️' : '🌙' }}
</div>
    <div class="ad-icon-btn" title="Alerts"><div class="ad-notif-pip"></div></div>
    <div class="ad-icon-btn" title="Quick actions">⚡</div>
    <div class="ad-icon-btn bg-[rgba(239,68,68,.15)] border-[rgba(239,68,68,.3)]" title="Critical alerts">🚨</div>
    <div class="w-[30px] h-[30px] rounded-[8px] bg-[linear-gradient(135deg,#c0392b,#8e1010)] flex items-center justify-center text-[.9rem] cursor-pointer" title="Admin profile">👤</div>
  </div>
</div>
