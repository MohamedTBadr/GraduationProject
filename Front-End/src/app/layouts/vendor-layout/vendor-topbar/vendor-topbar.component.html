<div class="vd-topbar">
  <div class="vd-topbar-title" id="vdTopTitle">Dashboard</div>
  <div class="vd-topbar-search">
    <i class="bi bi-search vd-search-icon"></i>
    <input type="text" placeholder="Search.."/>
  </div>
  <div class="vd-topbar-actions">
    <div class="vd-icon-btn" routerLink="/vendor-dashboard/notifications" title="Notifications">
      <i class="bi bi-bell"></i>
      <div class="vd-notif-dot" *ngIf="signalRService.unreadCount() > 0"></div>
    </div>
    <div  class="vd-icon-btn" title="Theme Toggle">
      <button class="vd-icon-btn" (click)="theme.toggleTheme()" title="Toggle theme">
          <i [class]="theme.isDark() ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
        </button>
    </div>
    <div class="vd-icon-btn" routerLink="/vendor-dashboard/messages" title="Messages">
      <i class="bi bi-chat"></i>
    </div>
    <div class="vd-icon-btn" routerLink="/vendor-dashboard/profile" title="Profile">
      <i class="bi bi-person"></i>
    </div>
  </div>
</div>
