<aside class="vendor-sidebar">
  <!-- Header / Logo -->
  <div class="sidebar-header">
    <div class="logo">Epic<span>Hub</span></div>
    <div class="logo-sub">Vendor Portal</div>
  </div>

  <!-- Vendor Identity -->
  <div class="vendor-identity">
    <div class="v-avatar">W</div>
    <div class="v-details">
      <div class="v-name">White Rose Decor</div>
      <div class="v-cat">Decoration · New Cairo</div>
      <div class="v-badge">
        <i class="bi bi-patch-check-fill"></i> Verified
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="group-title">Main</div>
      <a routerLink="/vendor-dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <i class="bi bi-house icon"></i>Dashboard
      </a>
      <a routerLink="/vendor-dashboard/bookings" routerLinkActive="active">
        <i class="bi bi-calendar3 icon"></i>Bookings
        <span class="badge badge-gold">8</span>
      </a>
      <a routerLink="/vendor-dashboard/messages" routerLinkActive="active">
        <i class="bi bi-chat icon"></i>Messages
        <span class="badge badge-red">3</span>
      </a>
      <a routerLink="/vendor-dashboard/notifications" routerLinkActive="active">
        <i class="bi bi-bell icon"></i>Notifications
        <span class="badge badge-red">5</span>
      </a>
    </div>

    <div class="nav-group">
      <div class="group-title">Catalog</div>
      <a routerLink="/vendor-dashboard/services" routerLinkActive="active">
        <i class="bi bi-tools icon"></i>My Services
      </a>
      <a routerLink="/vendor-dashboard/packages" routerLinkActive="active">
        <i class="bi bi-gem icon"></i>Packages
      </a>
      <a routerLink="/vendor-dashboard/portfolio" routerLinkActive="active">
        <i class="bi bi-images icon"></i>Portfolio
      </a>
    </div>

    <div class="nav-group">
      <div class="group-title">Insights</div>
      <a routerLink="/vendor-dashboard/analytics" routerLinkActive="active">
        <i class="bi bi-bar-chart icon"></i>Analytics
      </a>
      <a routerLink="/vendor-dashboard/earnings" routerLinkActive="active">
        <i class="bi bi-currency-dollar icon"></i>Earnings
      </a>
      <a routerLink="/vendor-dashboard/reviews" routerLinkActive="active">
        <i class="bi bi-star icon"></i>Reviews
      </a>
    </div>

    <div class="nav-group">
      <div class="group-title">Account</div>
      <a routerLink="/vendor-dashboard/profile" routerLinkActive="active">
        <i class="bi bi-person icon"></i>Profile
      </a>
      <a routerLink="/" class="exit-item">
        <i class="bi bi-arrow-left icon"></i>Back to EpicHub
      </a>
    </div>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="system-status">
      <div class="status-dot"></div>
      Online · Accepting bookings
    </div>
  </div>
</aside>
