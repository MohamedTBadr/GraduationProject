<div class="usr-topbar">

  <!-- Page breadcrumb / title -->
  <div class="ust-breadcrumb">
    <div class="ust-page-title">Welcome back, {{ authService.user()?.name || 'User' }} </div>
    <div class="ust-page-sub">
      <i class="fa-solid fa-calendar-days"></i>
      {{ today | date:'short' }} &nbsp;·&nbsp;
      <span>3 active events</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="ust-actions">

    <!-- Date chip -->
    <div class="ust-date-chip">
      <i class="fa-solid fa-sun"></i>
      Good morning
    </div>

    <!-- Notifications -->
    <button class="ust-icon-btn" title="Notifications">
      <i class="fa-solid fa-bell"></i>
      <span class="ust-notif-dot"></span>
    </button>

    <!-- Search -->
    <button class="ust-icon-btn" title="Search">
      <i class="bi bi-search"></i>
    </button>

    <!-- Add Event CTA -->
    <button class="ust-add-btn" routerLink="/add-event">
      <i class="bi bi-plus-circle"></i>
      New Event
    </button>

  </div>

</div>
