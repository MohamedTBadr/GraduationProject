<div class="ad-section active" style="display:block">
  <div class="ad-page-hd">
    <div>
      <div class="ad-page-title">Broadcast Notifications</div>
      <div class="ad-page-sub">Send mass announcements to users or vendors via push/email.</div>
    </div>
  </div>
  <div class="ad-g2" style="align-items:start">
    <div class="ad-card" style="position:sticky;top:30px">
      <div class="ad-card-title">Compose Message</div>
      <div class="ad-form-group"><label>Target Audience</label><select><option>All Vendors</option><option>All Users</option><option>Specific Vendors (City)</option></select></div>
      <div class="ad-form-group"><label>Subject</label><input type="text" placeholder="e.g. System Maintenance Notice"/></div>
      <div class="ad-form-group"><label>Message</label><textarea placeholder="Type your announcement here..." style="min-height:120px"></textarea></div>
      <div class="ad-form-group"><label>Channel</label><div style="display:flex;gap:15px;margin-top:5px;font-size:.9rem"><label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--white);margin:0"><input type="checkbox" checked/> Push Notification</label><label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--white);margin:0"><input type="checkbox" checked/> Email</label></div></div>
      <button class="ad-btn ad-btn-gold" style="width:100%;justify-content:center;margin-top:10px">Send Broadcast </button>
    </div>
    <div class="ad-card">
      <div class="ad-card-title">Recent Broadcasts</div>
      <div id="ad-recent-broadcasts">
        <div style="padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="ad-pill ap-amber">All Vendors</span><span style="font-size:.75rem;color:rgba(255,255,255,.4)">Today, 10:00 AM</span></div>
          <div style="font-weight:600;margin-bottom:4px">March Payouts Processed</div>
          <div style="font-size:.85rem;color:rgba(255,255,255,.6);line-height:1.4">All pending payouts for February have been processed. Funds should reflect in your accounts within 1-3 business days.</div>
        </div>
      </div>
    </div>
  </div>
</div>
