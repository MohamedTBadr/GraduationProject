services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: GraduationProject-Web
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GraduationProject;User=sa;Password=MyPass@word;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - Ollama__Url=http://ollama:11434
      - Ollama__Model=llama3.2
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  ollama:
    image: ollama/ollama
    container_name: Graduation-Project-Ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Graduation-Project-Db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyPass@word
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MyPass@word -No -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: Graduation-Project-Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

volumes:
  sql_data:
  redis_data:
  ollama_data:    # persists downloaded models