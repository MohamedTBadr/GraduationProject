version: '3.9'

services:

  # =========================================
  # API GATEWAY
  # =========================================
  gateway.api:
    build:
      context: .
      dockerfile: Gateway.API/Dockerfile

    container_name: GraduationProject-Gateway

    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081

      # YARP → Web API
      ReverseProxy__Clusters__webapi-cluster__Destinations__webapi-destination__Address: http://web.api:8080

    depends_on:
      - web.api

    restart: unless-stopped

    mem_limit: 512m
    cpus: 0.50

    networks:
      - graduation-network


  # =========================================
  # WEB API
  # =========================================
  web.api:
    build:
      context: .
      dockerfile: Web.Api/Dockerfile

    container_name: GraduationProject-WebApi

    ports:
      - "5030:8081"
      - "5031:8080"

    expose:
      - "8080"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

      aspire-dashboard:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Server=db,1433;Database=GraduationProject;User Id=sa;Password=MyPass@word;TrustServerCertificate=True;Connect Timeout=60;

      ConnectionStrings__Redis: redis:6379

      Ollama__Url: http://ollama:11434
      Ollama__Model: llama3.2

      Telemetry__Endpoint: http://aspire-dashboard:18889

    restart: unless-stopped

    mem_limit: 1g
    cpus: 0.75

    networks:
      - graduation-network


  # =========================================
  # NGROK
  # =========================================
  ngrok:
    image: ngrok/ngrok:latest

    container_name: GraduationProject-Ngrok

    command:
      - "http"
      - "gateway.api:8081"
      - "--url=pierre-sacred-sparkishly.ngrok-free.dev"

    environment:
      NGROK_AUTHTOKEN: 3EXzLM2Ial0tURTtHVJZdmcqSCv_2GAKBiCkHi4GQuUTJeEGS

    depends_on:
      - gateway.api

    ports:
      - "4040:4040"

    restart: unless-stopped

    networks:
      - graduation-network


  # =========================================
  # ASPIRE DASHBOARD
  # =========================================
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest

    container_name: GraduationProject-Telemetry

    ports:
      - "18888:18888"
      - "18889:18889"

    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

    restart: unless-stopped

    mem_limit: 256m
    cpus: 0.25

    networks:
      - graduation-network


  # =========================================
  # SQL SERVER
  # =========================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: GraduationProject-Db

    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: MyPass@word
      MSSQL_PID: Developer

      MSSQL_MEMORY_LIMIT_MB: 1700

      MSSQL_TEMPDB_DATA_SIZE_MB: 256
      MSSQL_TEMPDB_LOG_SIZE_MB: 64

      MSSQL_AGENT_ENABLED: "false"
      MSSQL_ENABLE_HADR: "0"

      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS

      MSSQL_TCP_PORT: 1433

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    mem_limit: 2g
    mem_reservation: 512m

    cpus: 1.0
    cpu_shares: 512

    shm_size: 256m

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MyPass@word -No -Q 'SELECT 1' || exit 1"
        ]

      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    restart: unless-stopped

    networks:
      - graduation-network


  # =========================================
  # REDIS
  # =========================================
  redis:
    image: redis:7.2-alpine

    container_name: GraduationProject-Redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    mem_limit: 256m
    cpus: 0.25

    networks:
      - graduation-network


# =========================================
# NETWORKS
# =========================================
networks:
  graduation-network:
    driver: bridge


# =========================================
# VOLUMES
# =========================================
volumes:
  sql_data:
  redis_data:
