version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aspnet8-app
    ports:
      - "5000:8080"   # http://localhost:5000
    depends_on:
      - db
      - redis
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=AppDb;User=sa;Password=MyPass@word;TrustServerCertificate=True;
      - Redis__Connection=redis:6379
    # optional restart policy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyPass@word
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
